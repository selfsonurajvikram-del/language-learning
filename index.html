}

.card{

}

h1,h2{

.subtitle{

label{

select,input{

    padding:13px;

button{

.startBtn{

.backBtn{

}

.testBtn{

    color:white;
    margin-top:10px;
}

.info{

    padding:12px;
    border-radius:10px;
    margin:15px 0;
}

.status{
    padding:10px;
    background:#fff7df;
    border-radius:10px;
    margin:10px 0;
    font-size:14px;
}

.wordCard{
    background:#f8f9ff;

    padding:18px;
    border-radius:15px;
    border-left:5px solid #2575fc;
}

.source{
    color:#666;
    font-size:14px;
}

.word{
    font-size:27px;
    font-weight:bold;
    margin:8px 0;
}

.pronunciation{
    color:#6a11cb;
    font-size:17px;
    margin:6px 0;
}

.meaning{
    color:#333;
    margin:8px 0;
}

.category{
    display:inline-block;
    background:#e8edff;
    padding:5px 9px;
    border-radius:8px;
    font-size:12px;
    margin-bottom:10px;
}

.listenBtn{
    background:#2575fc;
    color:white;
    margin-right:5px;
}

.meaningBtn{
    background:#eee;
}

.pagination{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin:20px 0;
}

.pagination button{
    background:white;
}

.hidden{
    display:none;
}

.small{
    font-size:13px;
    color:#666;
    text-align:center;

</style>
</head>

<body>

<div class="container">

<!-- SETUP PAGE -->
<div class="card" id="setupPage">

    <h1>🌍 Learn Another Language</h1>

    <p class="subtitle">
        Choose your language and the language you want to learn.
    </p>

    <label>Your Language</label>

    <select id="nativeLanguage"></select>

    <label>Language You Want To Learn</label>

    <select id="learningLanguage"></select>

    <button class="startBtn" onclick="startLearning()">
        Start Learning 🚀
    </button>

</div>


<!-- LEARNING PAGE -->
<div class="card hidden" id="learningPage">

    <button class="backBtn" onclick="goBack()">
        ← Back
    </button>

    <h1>📚 Learn Vocabulary</h1>

    <div class="info" id="languageInfo"></div>

    <div class="status" id="voiceStatus">
        Checking voice...
    </div>

    <button class="testBtn" onclick="testVoice()">
        🔊 Test Voice
    </button>

    <input
        type="text"
        id="searchBox"
        placeholder="Search a word..."
        oninput="showWords()"
    >

    <select id="categoryFilter" onchange="showWords()">
        <option value="all">All Categories</option>
        <option value="basic">Basic</option>
        <option value="people">People</option>
        <option value="daily">Daily Life</option>
        <option value="numbers">Numbers</option>
        <option value="school">School</option>
        <option value="food">Food</option>
        <option value="travel">Travel</option>
        <option value="feelings">Feelings</option>
        <option value="nature">Nature</option>
        <option value="verbs">Verbs</option>
        <option value="advanced">Advanced</option>
    </select>

    <div id="wordList"></div>

    <div class="pagination">
        <button onclick="previousPage()">⬅ Previous</button>
        <span id="pageInfo"></span>
        <button onclick="nextPage()">Next ➡</button>
    </div>

    <p class="small">
        Tip: Tap 🔊 to hear the word.
    </p>

</div>

</div>

/* =========================================================
   LOAD 100 LANGUAGES INTO BOTH BOXES
   ========================================================= */

function loadLanguages(){

    const native = document.getElementById("nativeLanguage");
    const learning = document.getElementById("learningLanguage");

    native.innerHTML = "";
    learning.innerHTML = "";

    uniqueLanguages.forEach((lang,index)=>{

        const option1 = document.createElement("option");
        option1.value = index;
        option1.textContent = lang[0];

        const option2 = document.createElement("option");
        option2.value = index;
        option2.textContent = lang[0];

        native.appendChild(option1);
        learning.appendChild(option2);

    });

    native.value = "0";
    learning.value = "2";
}


/* =========================================================
   VARIABLES
   ========================================================= */

let nativeLanguage;
let learningLanguage;
let currentPage = 1;

const wordsPerPage = 10;


/* =========================================================
   START
   ========================================================= */

function startLearning(){

    nativeLanguage =
        uniqueLanguages[
            document.getElementById("nativeLanguage").value
        ];

    learningLanguage =
        uniqueLanguages[
            document.getElementById("learningLanguage").value
        ];

    document.getElementById("setupPage")
        .classList.add("hidden");

    document.getElementById("learningPage")
        .classList.remove("hidden");

    document.getElementById("languageInfo").innerHTML =
        "<b>Your language:</b> " +
        nativeLanguage[0] +
        "<br><b>Learning:</b> " +
        learningLanguage[0];

    currentPage = 1;

    checkVoice();

    showWords();
}


/* =========================================================
   BACK
   ========================================================= */

function goBack(){

    document.getElementById("learningPage")
        .classList.add("hidden");

    document.getElementById("setupPage")
        .classList.remove("hidden");
}

/* =========================================================
   GET TRANSLATION
   ========================================================= */

function getTranslation(item){

    const english = item[0];
    const hindi = item[2];
    const punjabi = item[3];

    if(learningLanguage[0] === "English"){
        return {
            word:english,
            pronunciation:english
        };
    }

    if(learningLanguage[0] === "Hindi"){
        return {
            word:hindi,
            pronunciation:hindi
        };
    }

    if(learningLanguage[0] === "Punjabi"){
        return {
            word:punjabi,
            pronunciation:getHindiPronunciation(punjabi)
        };
    }

    /*
      Other languages are available in the language list.
      Their translation database can be added next.
    */

    return {
        word:english,
        pronunciation:"Translation database coming soon"
    };
}


/* =========================================================
   GET MEANING
   ========================================================= */

function getMeaning(item){

    if(nativeLanguage[0] === "Hindi"){
        return item[2];
    }

    if(nativeLanguage[0] === "Punjabi"){
        return item[3];
    }

    if(nativeLanguage[0] === "English"){
        return item[0];
    }

    return item[0];
}


/* =========================================================
   SHOW WORDS
   ========================================================= */

function showWords(){

    const search =
        document.getElementById("searchBox")
        .value
        .toLowerCase()
        .trim();

    const category =
        document.getElementById("categoryFilter").value;

    let filtered = vocabulary.filter(item => {

        const matchesSearch =
            item[0].toLowerCase().includes(search) ||
            item[2].toLowerCase().includes(search) ||
            item[3].toLowerCase().includes(search);

        const matchesCategory =
            category === "all" ||
            item[1] === category;

        return matchesSearch && matchesCategory;

    });


    const totalPages =
        Math.max(1,Math.ceil(filtered.length / wordsPerPage));

    if(currentPage > totalPages){
        currentPage = totalPages;
    }


    const start =
        (currentPage - 1) * wordsPerPage;

    const pageWords =
        filtered.slice(start,start + wordsPerPage);


    const list =
        document.getElementById("wordList");

    list.innerHTML = "";


    if(pageWords.length === 0){

        list.innerHTML =
            "<p style='text-align:center'>No word found.</p>";

        document.getElementById("pageInfo").textContent =
            "0 / 0";

        return;
    }


    pageWords.forEach(item => {

        const translation = getTranslation(item);
        const meaning = getMeaning(item);

        const card = document.createElement("div");

        card.className = "wordCard";

        card.innerHTML = `

            <span class="category">
                ${escapeHTML(item[1])}
            </span>

            <div class="source">
                English: ${escapeHTML(item[0])}
            </div>

            <div class="word">
                ${escapeHTML(translation.word)}
            </div>

            ${
                translation.pronunciation
                ?
                `<div class="pronunciation">
                    Hindi reading:
                    ${escapeHTML(translation.pronunciation)}
                </div>`
                :
                ""
            }

            <div class="meaning">
                Meaning:
                ${escapeHTML(meaning)}
            </div>

            <button
                class="listenBtn"
                onclick='speakWord(${JSON.stringify(
                    translation.word
                )})'
            >
                🔊 Listen
            </button>

            <button
                class="meaningBtn"
                onclick='showMeaning(${JSON.stringify(
                    meaning
                )})'
            >
                Meaning
            </button>
        `;

        list.appendChild(card);

    });


    document.getElementById("pageInfo").textContent =
        currentPage + " / " + totalPages;
}

/* =========================================================
   SPEECH
   ========================================================= */

let voices = [];


function loadVoices(){

    voices = speechSynthesis.getVoices();

    checkVoice();

}


function findVoice(languageCode){

    if(!voices.length){
        return null;
    }

    const exact =
        voices.find(v =>
            v.lang.toLowerCase() ===
            languageCode.toLowerCase()
        );

    if(exact){
        return exact;
    }

    const shortCode =
        languageCode.split("-")[0].toLowerCase();

    return voices.find(v =>
        v.lang.toLowerCase().startsWith(shortCode)
    ) || null;
}


function speakWord(text){

    if(!("speechSynthesis" in window)){

        alert(
            "Your browser does not support voice. Please open this file in Chrome."
        );

        return;
    }


    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang =
        learningLanguage[1];

    utterance.rate = 0.8;
    utterance.pitch = 1;
    utterance.volume = 1;


    const voice =
        findVoice(learningLanguage[1]);

    if(voice){
        utterance.voice = voice;
    }


    utterance.onstart = function(){

        document.getElementById("voiceStatus")
            .textContent =
            "🔊 Speaking " +
            learningLanguage[0] +
            "...";

    };


    utterance.onend = function(){

        checkVoice();

    };


    utterance.onerror = function(){

        document.getElementById("voiceStatus")
            .textContent =
            "❌ Voice could not play. Try Chrome + Google Speech Services.";

    };


    speechSynthesis.speak(utterance);

}


/* =========================================================
   TEST VOICE
   ========================================================= */

function testVoice(){

    let testText = "Hello";

    if(learningLanguage[0] === "Hindi"){
        testText = "नमस्ते";
    }

    if(learningLanguage[0] === "Punjabi"){
        testText = "ਸਤ ਸ੍ਰੀ ਅਕਾਲ";
    }

    speakWord(testText);

}


/* =========================================================
   CHECK VOICE
   ========================================================= */

function checkVoice(){

    if(!learningLanguage){
        return;
    }

    if(!("speechSynthesis" in window)){

        document.getElementById("voiceStatus")
            .textContent =
            "❌ Speech is not supported in this browser.";

        return;
    }


    const voice =
        findVoice(learningLanguage[1]);


    if(voice){

        document.getElementById("voiceStatus")
            .textContent =
            "✅ Voice available: " +
            voice.name +
            " (" +
            voice.lang +
            ")";

    }else{

        document.getElementById("voiceStatus")
            .textContent =
            "⚠️ No matching " +
            learningLanguage[0] +
            " voice found on this device. Chrome/Google Speech Services may be needed.";

    }

}


/* =========================================================
   SECURITY
   ========================================================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   INITIALIZE
   ========================================================= */

loadLanguages();

if("speechSynthesis" in window){

    speechSynthesis.onvoiceschanged =
        loadVoices;

    setTimeout(loadVoices,500);
    setTimeout(loadVoices,1500);

}
